<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Muhammad Tayyab</title>
    <meta name="theme-color" content="#080c17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Sora:wght@400;600;700&display=swap"
    />
    <!--
      Deliberately self-contained: no reference to the hashed CSS bundle, so
      this page keeps working regardless of what the app build produces.
    -->
    <style>
      *{ margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #080c16; color: #f8fafc;
        font-family: Sora, system-ui, -apple-system, "Segoe UI", sans-serif;
        background-image:
          linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .wrap { max-width: 520px; text-align: center; }
      .code {
        font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px;
        letter-spacing: 0.16em; text-transform: uppercase; color: #00bdd6;
      }
      h1 { margin-top: 16px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
      p { margin-top: 16px; font-size: 17px; line-height: 1.6; color: #94a3b8; }
      .actions { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-block; padding: 11px 22px; border-radius: 8px;
        font-size: 15px; font-weight: 600; text-decoration: none;
        background: #00bdd6; color: #080c16;
      }
      a.btn:hover { background: #01acc4; }
      a.ghost { background: transparent; color: #f8fafc; border: 1px solid #20283c; font-weight: 500; }
      a.ghost:hover { background: #191f2e; }
      a.btn:focus-visible, a.ghost:focus-visible { outline: 2px solid #00bdd6; outline-offset: 2px; }
      .foot { margin-top: 32px; font-size: 14px; color: #94a3b8; }
      .foot a { color: #00bdd6; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>
        That page doesn't exist, or it may have moved. The link that brought you
        here might be out of date.
      </p>
      <div class="actions">
        <a class="btn" href="/">Back to portfolio</a>
        <a class="btn ghost" href="/#contact">Get in touch</a>
      </div>
      <p class="foot">
        Or email <a href="mailto:mtaeyyab15@gmail.com">mtaeyyab15@gmail.com</a>
      </p>
    </main>
  </body>
</html>
